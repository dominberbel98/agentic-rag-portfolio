version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: rag-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

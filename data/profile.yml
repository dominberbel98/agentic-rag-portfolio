# ── Narrative ───────────────────────────────────────────────────────────────
# Prose, deliberately. These answer the "what is he like to work with" questions
# that structured fields cannot.

narrative:
  adaptability: >-
    Domingo has lived independently since he was eighteen, studying and working
    away from his family environment across several cities and countries: Almería,
    Seville, Bratislava on an Erasmus programme, Berlin on an international
    internship, and now Madrid. Moving continuously through different cultural and
    professional contexts has built autonomy, maturity and the ability to
    integrate quickly into a new team — reading its internal dynamics, adjusting
    to different leadership styles, and contributing from a collaborative
    position. He does not merely tolerate change; he has a demonstrated habit of
    turning uncertainty into learning.

  resilience: >-
    His trajectory is a deliberate career change, not a drift. After starting out
    in marketing, international sales and logistics, he moved into data science
    through sustained effort rather than opportunism: a demanding master's
    degree, a series of technical certifications, and advanced practical projects
    in statistics, machine learning and deep learning. He acquired complex
    competencies from scratch and established himself as a Data Scientist while
    keeping a pragmatic, results-oriented approach. He changes direction when he
    identifies a real opportunity for impact and development, not by inertia.

  teamwork: >-
    Teamwork is central to how he operates. The clearest example is the
    neural-network tourism recommender with generative AI support that he built as
    his master's thesis, working closely with other technical profiles —
    coordinating effort, aligning objectives, and contributing to both the
    analytical work and the framing of business impact. His ability to explain
    complex ideas, listen, and build consensus was decisive to that project, which
    earned the top grade and competitive academic recognition. Earlier, at MyES
    Sevilla, he and his team generated more than half of the school's total revenue
    since opening.

  career_change: >-
    What makes the profile unusual is that the business years were not wasted
    time. Having sold, priced, negotiated and reported to stakeholders, he
    understands what an organisation is actually trying to decide when it asks for
    a model — and he can present the result to people who will never read the
    code. He combines statistical rigour with commercial judgement, and works
    across the full data lifecycle: ingestion, ETL pipeline design, cleaning and
    transformation, statistical and machine learning modelling, validation,
    deployment, and the communication of results to non-technical stakeholders.
    His statistical grounding is what lets him design sound analyses and validate
    models with judgement, instead of producing exploratory work with no bearing
    on a decision.

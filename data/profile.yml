# ── Projects ────────────────────────────────────────────────────────────────

projects:
  - id: portfolio-chatbot
    name: Portfolio RAG assistant
    year: 2026
    summary: >-
      This site, and the assistant answering in it. A web portfolio designed to
      present a professional profile in a clearer, more useful and interactive
      way than a static CV can.
    problem: >-
      A static CV forces every reader down the same path, when a recruiter, a
      hiring manager and an engineer each want to know something different.
      Information should adapt to whoever is asking.
    approach: >-
      A retrieval-augmented assistant over a structured profile. The knowledge
      base is a single validated YAML file generated into one document per entity
      — role, project, degree, certification — embedded with Google's
      gemini-embedding-2. Retrieval is hybrid: dense vectors fused with BM25
      keyword scores via Reciprocal Rank Fusion, then reranked by the language
      model. Generation runs on the OpenAI API. The model is given search tools
      rather than a fixed context, so it decides what to look up and can search
      again when the first pass is thin. A groundedness check compares named
      entities in the answer against the profile vocabulary before the answer is
      returned, so the assistant cannot attribute a technology he has never used.
      React, Vite and Tailwind CSS on the frontend with a CRT/retro theme,
      streaming answers over Server-Sent Events; Python 3.11 with FastAPI,
      Pydantic and Uvicorn on the backend. Cloudflare Turnstile for CAPTCHA,
      per-IP rate limiting, a daily token budget, pre-LLM content guardrails,
      Nginx serving security headers (CSP, HSTS, X-Frame-Options), and
      SQLite-backed question analytics with protected admin endpoints. Deployed
      as a Docker container on Azure Container Apps behind a custom domain, with
      the frontend on Azure Static Web Apps and secrets held as Container Apps
      secrets rather than plain environment variables.
    outcome: >-
      Live and serving real traffic at domingoberbel.com. It demonstrates the
      whole path from architecture to production rather than a notebook: the
      same person chose the retrieval strategy, wrote the guardrails, and owns
      the deployment.
    stack:
      - Python
      - FastAPI
      - Pydantic
      - Uvicorn
      - React
      - Vite
      - Tailwind CSS
      - Server-Sent Events
      - Docker
      - Azure
      - Azure Container Apps
      - Azure Static Web Apps
      - RAG
      - LLMs
      - OpenAI API
      - Google Gemini
      - embeddings
      - BM25
      - SQLite
      - Nginx
    repo: https://github.com/dominberbel98/agentic-rag-portfolio
    live_url: https://domingoberbel.com

  - id: tfm-tourism-recommender

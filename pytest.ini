[pytest]
testpaths = tests
# `backend` so `app.*` resolves exactly as it does in the container, where
# backend/ is the working directory. `.` so `scripts.*` resolves. Importing the
# same module under two names (app.x and backend.app.x) would create two
# distinct module objects, so tests use `app.*` only.
pythonpath = . backend
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:google.*
